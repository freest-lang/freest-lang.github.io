<style>

html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
}

:root {
  --pg-nav-w: 16.5rem;
}

.main {
  max-width: none;
  height: 100%;
  overflow: hidden;
}

@media (min-width: 66.5rem) { /* mq(lg) */
  .side-bar {
    width: var(--pg-nav-w);
  }

  .side-bar + .main {
    margin-left: var(--pg-nav-w);
  }
}

.main-content {
  height: 100%;
  overflow: hidden;
}

#top {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.main-content-wrap {
  padding: 0;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}


.main-content > main {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.main-content > footer,
.main-content > hr {
  display: none;
}

/* playground content */

#panels { 
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  border-top: 1px solid #e3e2df;
}

.panel {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  min-height: 0;
}

.panel:first-child {
  border-right: 1px solid #e3e2df;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  font-size: 0.6875rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #8a8985;
  border-bottom: 1px solid #e3e2df;
  flex: none;
  min-height: 52px; 
  box-sizing: border-box;
}

.panel-header .header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

#buttonRUN {
  background-color: #0073bd;
  color: white;
  border: none;
  padding: 4px 16px;
  font-weight: bolder;
  font-size: inherit;
  cursor: pointer;
  border-radius: 6px;
}

#buttonRUN:hover {
  background-color: #0269a9;
}

#buttonRUN:active {
  background-color: #025a91;
}

/* Dropdown Button */
.dropbtn {
  background-color: transparent;
  color: #5c5962;
  border: 1px solid #d0cfcb;
  min-width: 130px;
  padding: 4px 28px 4px 12px;
  font-size: inherit;
  cursor: pointer;
  border-radius: 6px;
  text-align: left;
  position: relative;
}

.dropbtn::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 12px;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid #5c5962;
  transform: translateY(-50%);
  pointer-events: none;
}

.dropbtn:hover {
  background-color: #f1faff;
}

/* The container <div> - needed to position the dropdown content */
.dropdown {
  position: relative;
}

/* Dropdown Content (Hidden by Default) */
.dropdown-content {
  display: none;
  position: absolute;
  right: 0; 
  margin-top: 8px;
  border: 1px solid #5c5962;  
  border-radius: 12px;
  overflow: hidden;
  z-index: 10;
}

/* Links inside the dropdown */
.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

.templatebtn {
  min-width: 160px;
  min-height: 40px;
  background-color: white;
  color: #4d4c4f;
  border: 0;
}

/* Change color of dropdown links on hover */
.templatebtn:hover {background-color: #f1faff;}

#textEditor {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 5px 0px;
  font-family: overpass-mono, monospace;
  font-size: 0.85rem;
  line-height: 1.5;
}

#output {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 5px;
  margin: 0;
  font-size: 0.85rem;
  font-family: overpass-mono, monospace;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
  background-color: #212a2f;
  color: white;
}
</style>

<div id="panels">
  <div class="panel">
    <div class="panel-header">
      <div class="filename">main.fst</div>
      <div class="header-actions">
        <button id="buttonRUN" type="button">Run</button>
        <div class="dropdown">
          <button class="dropbtn" id="dropbtn" type="button">Hello World!</button>
          <div class="dropdown-content">
            <button class="templatebtn" id="temp1" type="button">Hello World!</button>
            <button class="templatebtn" id="temp2" type="button">2</button>
            <button class="templatebtn" id="temp3" type="button">3</button>
          </div>
        </div>
      </div>
    </div>
    <div class="textEditor" id="textEditor"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="filename">output</div>
      <div class="header-actions"></div>
    </div>
    <div id="output">Click the "RUN" button to execute the code on the left.</div>
  </div>
</div>

<script>
  var dropb = document.getElementById("dropbtn");
  var content = document.querySelector(".dropdown-content");
  var dropdown = document.querySelector(".dropdown");

  dropb.addEventListener('click', function(){
    content.style.display = content.style.display === "block" ? "none" : "block";
  });

  document.querySelectorAll(".templatebtn").forEach(button => {
    button.addEventListener('click', function(){
      content.style.display = "none";
      document.getElementById("dropbtn").textContent = button.textContent
    });
  });

  document.addEventListener('click', function(e){
    if (!dropdown.contains(e.target)) {
      content.style.display = "none";
    }
  });
</script>

<script src="/playground/codeMirror/editor.bundle.js"></script>
<script>createEditor("textEditor", "main : ()\nmain = putStrLn \"Hello world!\"");</script>
<script src="/playground/buttonBackend.js"></script>
<script src="/playground/templateButtons.js"></script>
